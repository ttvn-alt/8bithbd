<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVL. 99 HAPPY BIRTHDAY, MY BABY!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-purple: #7B2CBF;
            --pixel-light-purple: #9D4EDD;
            --pixel-yellow: #FFB703;
            --pixel-pale-yellow: #FFD166;
            --pixel-bg: #240046;
            --pixel-cream: #FFF3F8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', monospace;
            /* บังคับให้ทุกอย่างคมชัดแบบบล็อกพิกเซล ไม่ให้เบลอ */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        body {
            background-color: var(--pixel-bg);
            /* ลายพื้นหลังพิกเซลจุดสไตล์เกมย้อนยุค */
            background-image: radial-gradient(#3a0ca3 20%, transparent 20%);
            background-size: 16px 16px;
            color: #FFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 10px;
        }

        /* พลุกระดาษพิกเซลสี่เหลี่ยม */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* หน้าต่างเควสเริ่มต้นเกม */
        #permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(16, 0, 36, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s steps(4);
            padding: 20px;
        }

        /* กล่องข้อความสไตล์เกมโบราณคลาสสิก */
        .retro-dialog-box {
            background: #000;
            border: 6px solid #FFF;
            outline: 6px solid #000;
            padding: 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.5);
        }

        .retro-dialog-box h2 {
            font-size: 12px;
            color: var(--pixel-yellow);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .retro-dialog-box p {
            font-size: 9px;
            line-height: 1.8;
            margin-bottom: 25px;
            color: #A5A5A5;
        }

        .pixel-btn {
            background-color: var(--pixel-purple);
            color: #FFF;
            border: 4px solid #FFF;
            outline: 4px solid var(--pixel-purple);
            padding: 12px 20px;
            font-size: 10px;
            cursor: pointer;
            display: inline-block;
        }

        .pixel-btn:active {
            transform: translate(4px, 4px);
        }

        /* แถบรายงานความดังเสียงสไตล์เกมตู้ */
        .status-bar {
            background: #000;
            border: 4px solid var(--pixel-light-purple);
            padding: 12px;
            margin-bottom: 20px;
            font-size: 8px;
            color: #FFF;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 600px;
            width: 95%;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.3);
        }

        .heart-indicator {
            font-size: 12px;
            color: #FF0055;
            animation: heart-beat 0.6s steps(2) infinite;
        }

        @keyframes heart-beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        /* พื้นที่เวทีจัดปาร์ตี้หลัก */
        .game-stage {
            position: relative;
            width: 100%;
            max-width: 680px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 4px dashed #3a0ca3;
            border-radius: 8px;
        }

        /* เค้กชิบะพิกเซลตรงกลาง */
        .cake-node {
            position: relative;
            width: 180px;
            height: 220px;
            z-index: 3;
        }

        /* เทียนไขพิกเซลและเปลวไฟ */
        .candle {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 40px;
            z-index: 5;
        }
        .candle-wick {
            width: 4px;
            height: 16px;
            background: var(--pixel-pale-yellow);
            margin: 0 auto;
            border: 2px solid #000;
        }
        .pixel-flame {
            width: 10px;
            height: 14px;
            background: #FF4500;
            margin: 0 auto;
            border: 2px solid #000;
            animation: flame-wag 0.2s steps(2) infinite;
        }
        .pixel-flame.shake {
            background: #FFCC00;
            transform: scale(0.8) skewX(20deg);
        }
        .pixel-flame.dead {
            display: none;
        }
        .smoke-puff {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 12px;
            background: #BDC3C7;
            opacity: 0;
        }
        .smoke-puff.active {
            animation: smoke-fade 1.5s steps(5) forwards;
        }

        @keyframes flame-wag { 0% { transform: translateY(0); } 50% { transform: translateY(-2px) scaleX(1.1); } }
        @keyframes smoke-fade {
            0% { top: -5px; opacity: 0.8; transform: translateX(-50%) scale(1); }
            100% { top: -40px; opacity: 0; transform: translateX(-30%) scale(2.5); }
        }

        /* --- ฝั่งขวา: ตัวละครแฟนและแมวหน้ากวน สไตล์พิกเซลน่ารักกวนๆ --- */
        .duo-characters {
            position: absolute;
            right: 15px;
            bottom: 10px;
            width: 210px;
            height: 230px;
            z-index: 4;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        /* ป้าย Level Up สีเขียวสดใสลอยเด่น */
        .lvl-up-tag {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #000;
            border: 3px solid #00E676;
            color: #00E676;
            font-size: 8px;
            padding: 5px 8px;
            white-space: nowrap;
            transition: transform 0.4s steps(4);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
        }
        .revealed .lvl-up-tag {
            transform: translateX(-50%) scale(1);
            animation: tag-float 0.8s infinite alternate steps(3);
        }

        @keyframes tag-float { 0% { transform: translateX(-50%) translateY(0); } 100% { transform: translateX(-50%) translateY(-6px); } }

        /* ฝั่งซ้าย: แก๊งน้องแมว 5 ตัว อ้วนกลมพิกเซล ดุ๊กดิ๊กไปมา */
        .cats-pixel-party {
            position: absolute;
            left: 15px;
            bottom: 10px;
            width: 210px;
            height: 230px;
            z-index: 2;
        }
        .pixel-cat {
            position: absolute;
            width: 55px;
            height: 55px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s steps(4);
            animation: cat-bounce 0.4s infinite alternate steps(2);
        }
        .revealed .pixel-cat { opacity: 1; transform: translateY(0); }
        
        /* สลับจังหวะการเต้นดุ๊กดิ๊กของแมวแต่ละตัว */
        .cat-p1 { bottom: 0px; left: 0px; transition-delay: 0.1s; animation-delay: 0s; }
        .cat-p2 { bottom: 75px; left: 15px; transition-delay: 0.3s; animation-delay: 0.1s; }
        .cat-p3 { bottom: 145px; left: 0px; transition-delay: 0.5s; animation-delay: 0.2s; }
        .cat-p4 { bottom: 40px; left: 85px; transition-delay: 0.7s; animation-delay: 0.3s; }
        .cat-p5 { bottom: 115px; left: 100px; transition-delay: 0.9s; animation-delay: 0.4s; }

        @keyframes cat-bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }

        /* ข้อความแบนเนอร์แสดงความยินดีสไตล์ Retro */
        .hbd-retro-banner {
            margin-top: 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.6s steps(4);
            max-width: 90%;
        }
        .hbd-retro-banner.active {
            opacity: 1;
            transform: translateY(0);
        }
        .hbd-pixel-title {
            font-size: 13px;
            color: var(--pixel-yellow);
            text-shadow: 4px 4px 0 var(--pixel-purple);
            line-height: 1.8;
            margin-bottom: 12px;
        }
        .hbd-pixel-sub {
            font-size: 8px;
            color: #DDD;
            line-height: 1.6;
            background: #000;
            padding: 8px 12px;
            border: 2px solid #FFF;
            display: inline-block;
        }

        /* รองรับขนาดหน้าจอเล็ก */
        @media (max-width: 500px) {
            .game-stage { transform: scale(0.72); margin-bottom: -55px; height: 340px; }
            .hbd-pixel-title { font-size: 10px; }
            .hbd-pixel-sub { font-size: 7px; }
        }
    </style>
</head>

    <script>
        const startBtn = document.getElementById('start-btn');
        const permissionOverlay = document.getElementById('permission-overlay');
        const statusText = document.getElementById('status-text');
        const candleFlame = document.getElementById('candle-flame');
        const smokePuff = document.getElementById('smoke-puff');
        const mainStage = document.getElementById('main-stage');
        const retroBanner = document.getElementById('retro-banner');
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');

        let audioContext;
        let analyser;
        let dataArray;
        let microphone;
        let isBlownOut = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ระบบระเบิดเศษพลุกระดาษบล็อกพิกเซลสี่เหลี่ยม (Retro Pixel Confetti)
        let confettiArray = [];
        const retroPalette = ['#7B2CBF', '#9D4EDD', '#FFB703', '#FFD166', '#00E676', '#FF0055', '#FFF'];

        class ConfettiPixel {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 6 + 6; // บล็อกเหลี่ยมพิกเซลขนาดใหญ่กำลังดี
                this.color = retroPalette[Math.floor(Math.random() * retroPalette.length)];
                this.speedY = Math.random() * 2 + 3;
                this.speedX = Math.random() * 2 - 1;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > canvas.height) {
                    this.y = -10;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                // วาดตัดขอบแบบเหลี่ยมพิกเซลแท้ๆ ไม่เบลอมน
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
            }
        }

        function initConfetti() {
            for (let i = 0; i < 90; i++) {
                confettiArray.push(new ConfettiPixel());
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isBlownOut) {
                confettiArray.forEach(p => {
                    p.update();
                    p.draw();
                });
            }
            requestAnimationFrame(animateConfetti);
        }

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // เฟดออกแบบเป็นขั้นบันได (สไตล์เกมนิ่งๆ)
                permissionOverlay.style.opacity = '0';
                setTimeout(() => permissionOverlay.style.display = 'none', 400);
                
                statusText.innerText = "SYSTEM: MIC LIVE! BLOW HARD INTO SCREEN TO MAKE A WISH!";
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                monitorVolume();
            } catch (err) {
                console.error(err);
                statusText.innerText = "SYSTEM ERROR: MIC ACCESS REFUSED!";
                alert("Please grant mic permission to enable candle interaction!");
            }
        });

        function monitorVolume() {
            if (isBlownOut) return;

            analyser.getByteFrequencyData(dataArray);
            let total = 0;
            for (let i = 0; i < dataArray.length; i++) {
                total += dataArray[i];
            }
            let avg = total / dataArray.length;

            if (avg > 75) {
                triggerCelebration();
            } else if (avg > 35) {
                // เป่าลมแรงปานกลาง: เปลวไฟพิกเซลสั่นไหวโย้เย้
                candleFlame.className = "pixel-flame shake";
                statusText.innerText = "WIND DETECTED! POWER: OVER 50%.. KEEP BLOWING!!";
            } else {
                candleFlame.className = "pixel-flame";
                statusText.innerText = "SYSTEM: READY. OBJECTIVE: BLOW HARD DIRECTLY INTO MIC.";
            }

            requestAnimationFrame(monitorVolume);
        }

        function triggerCelebration() {
            isBlownOut = true;
            
            candleFlame.className = "pixel-flame dead";
            smokePuff.className = "smoke-puff active";
            statusText.innerText = "MISSION CLEAR! WISH GRANTED! HAPPY BIRTHDAY! 🎉🏆";
            
            document.getElementById('status-container').style.borderColor = "#00E676";
            document.getElementById('status-container').style.backgroundColor = "#002612";

            // สั่งเด้งปลดล็อคแมวพิกเซลปาร์ตี้ และ การ์ดคำอวยพร
            mainStage.classList.add('revealed');
            retroBanner.classList.add('active');

            initConfetti();
            animateConfetti();
        }
    </script>
</body>
</html>
