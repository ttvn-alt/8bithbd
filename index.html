<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVL. 99 HAPPY BIRTHDAY, MY BABY!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #7B2CBF;
            --light-purple: #9D4EDD;
            --bg-purple: #F3E5F5;
            --accent-yellow: #FFD166;
            --bright-yellow: #FFB703;
            --dark-text: #240046;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-purple);
            color: var(--dark-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            font-family: 'Fredoka One', cursive; /* ใช้ฟอนต์มนๆ น่ารักผสมผสาน */
        }

        /* พลุกระดาษฉลองเมื่อเป่าสำเร็จ */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* กล่องสิทธิ์สไตล์ RPG Game กล่องคู่ผสม */
        #permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(36, 0, 70, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
            padding: 20px;
        }

        .game-card {
            background: white;
            color: var(--dark-text);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 5px double var(--primary-purple);
        }

        .game-card h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            color: var(--primary-purple);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .game-card p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .mix-btn {
            background-color: var(--primary-purple);
            color: white;
            border: 3px solid var(--accent-yellow);
            padding: 14px 32px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(123, 44, 191, 0.4);
            transition: all 0.2s ease;
        }

        .mix-btn:hover {
            background-color: var(--light-purple);
            transform: translateY(-3px);
        }

        /* แถบสถานะข้อความเควสเกมล้ำๆ */
        .status-box {
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(123, 44, 191, 0.15);
            margin-bottom: 25px;
            font-weight: bold;
            border: 3px solid var(--light-purple);
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1rem;
        }

        .mic-dot {
            width: 12px;
            height: 12px;
            background-color: #ff4d6d;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.25); opacity: 1; }
        }

        /* เวทีงานปาร์ตี้หลัก */
        .stage-area {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        /* เค้กชิบะการ์ตูนตรงกลาง */
        .cake-center {
            position: relative;
            width: 240px;
            height: 280px;
            z-index: 3;
        }

        /* เทียนและเปลวไฟไหวสลับ */
        .candle-box {
            position: absolute;
            bottom: 145px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            width: 20px;
            height: 60px;
        }
        .stick {
            width: 10px;
            height: 35px;
            background: linear-gradient(to right, #ffd166, #ffb703);
            margin: 0 auto;
            border-radius: 4px;
            border: 1.5px solid var(--dark-text);
        }
        .flame {
            width: 16px;
            height: 24px;
            background: linear-gradient(to bottom, #ff007f, #ffb703);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            margin: 0 auto;
            animation: flicker 0.1s infinite alternate;
            transform-origin: center bottom;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.8);
        }
        .flame.flicker-hard {
            animation: flicker-hard-anim 0.06s infinite alternate;
            transform: scale(0.85) skewX(12deg);
        }
        .flame.extinguished {
            display: none;
        }

        /* เอฟเฟกต์ควันลอยละล่อง */
        .smoke {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 18px;
            background: rgba(200, 200, 200, 0.7);
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0;
        }
        .smoke.active {
            animation: smoke-rise 1.8s ease-out forwards;
        }

        @keyframes flicker { 0% { transform: scale(1) rotate(-1deg); } 100% { transform: scale(1.06) rotate(1deg); } }
        @keyframes flicker-hard-anim { 0% { transform: scale(0.9) rotate(-6deg) translateX(-1px); } 100% { transform: scale(0.7) rotate(6deg) translateX(1px); } }
        @keyframes smoke-rise {
            0% { top: -5px; opacity: 0.8; transform: translateX(-50%) scale(1); }
            50% { top: -25px; opacity: 0.4; transform: translateX(-40%) scale(1.8); }
            100% { top: -50px; opacity: 0; transform: translateX(-60%) scale(2.5); }
        }

        /* --- ฝั่งขวา: ตัวละครแฟนและแมวหน้ากวนสไตล์การ์ตูนผสมผสานล้ำๆ --- */
        .character-duo {
            position: absolute;
            right: -10px;
            bottom: 0;
            width: 220px;
            height: 270px;
            z-index: 4;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        /* ป้ายเวลอัพเลเวล 99 ลอยบนหัว */
        .lvl-banner {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #240046;
            color: #00E676;
            border: 3px solid #00E676;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            white-space: nowrap;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .revealed .lvl-banner {
            transform: translateX(-50%) scale(1);
            animation: float-jump 1s infinite alternate;
        }

        @keyframes float-jump { 0% { transform: translateX(-50%) translateY(0); } 100% { transform: translateX(-50%) translateY(-6px); } }

        /* ฝั่งซ้าย: กลุ่มน้องแมว 5 ตัวจากเวอชั่นแรก ปลดล็อคเด้งขึ้นมา */
        .cats-group {
            position: absolute;
            left: -10px;
            bottom: 0;
            width: 210px;
            height: 270px;
            z-index: 2;
        }
        .cat-portrait {
            position: absolute;
            width: 75px;
            height: auto;
            opacity: 0;
            transform: scale(0.4) translateY(30px);
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .revealed .cat-portrait {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .cat-1 { bottom: 0px; left: 0px; transition-delay: 0.2s; }
        .cat-2 { bottom: 90px; left: 20px; transition-delay: 0.4s; }
        .cat-3 { bottom: 170px; left: 5px; transition-delay: 0.6s; }
        .cat-4 { bottom: 45px; left: 100px; transition-delay: 0.8s; }
        .cat-5 { bottom: 130px; left: 115px; transition-delay: 1s; }

        /* การ์ดข้อความฉลอง HBD */
        .celebration-text {
            margin-top: 15px;
            text-align: center;
            opacity: 0;
            transform: translateY(25px);
            transition: all 1s ease;
            max-width: 90%;
        }
        .celebration-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .hbd-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--primary-purple);
            text-shadow: -3px -3px 0 var(--accent-yellow), 
                          3px -3px 0 var(--accent-yellow), 
                         -3px  3px 0 var(--accent-yellow), 
                          3px  3px 0 var(--accent-yellow),
                          0px  6px 12px rgba(0,0,0,0.15);
            letter-spacing: 1px;
            line-height: 1.3;
            margin-bottom: 12px;
        }
        .hbd-sub {
            font-size: 1.2rem;
            color: var(--light-purple);
            background: white;
            padding: 10px 24px;
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        /* การตอบสนองบนมือถือ */
        @media (max-width: 500px) {
            .stage-area { transform: scale(0.75); margin-bottom: -50px; height: 340px; }
            .hbd-title { font-size: 1.9rem; }
            .hbd-sub { font-size: 0.95rem; }
        }
    </style>
</head>

        const candleFlame = document.getElementById('candle-flame');
        const candleSmoke = document.getElementById('candle-smoke');
        const mainPartyStage = document.getElementById('main-party-stage');
        const hbdMessageBanner = document.getElementById('hbd-message-banner');
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');

        let audioContext;
        let analyser;
        let dataArray;
        let microphone;
        let isBlownOut = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ระบบพลุสายรุ้งฉลองชัย (Confetti System)
        let particles = [];
        const partyColors = ['#7B2CBF', '#9D4EDD', '#FFD166', '#FFB703', '#FF4D6D', '#00F5D4', '#FFF'];

        class PartyParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 8 + 6;
                this.color = partyColors[Math.floor(Math.random() * partyColors.length)];
                this.speedY = Math.random() * 3 + 3;
                this.speedX = Math.random() * 2 - 1;
                this.angle = Math.random() * 360;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += 2;
                if (this.y > canvas.height) {
                    this.y = -10;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.angle * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.restore();
            }
        }

        function initConfetti() {
            for (let i = 0; i < 110; i++) {
                particles.push(new PartyParticle());
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isBlownOut) {
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
            }
            requestAnimationFrame(animateConfetti);
        }

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                permissionOverlay.style.opacity = '0';
                setTimeout(() => permissionOverlay.style.display = 'none', 500);
                
                statusText.innerText = "🎤 MIC ACTIVE: Blow hard onto the candle to complete the quest!";
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                monitorVolume();
            } catch (err) {
                console.error(err);
                statusText.innerText = "❌ ERROR: MICROPHONE PERMISSION DENIED!";
                alert("Please grant mic permission to activate the interactive card elements.");
            }
        });

        function monitorVolume() {
            if (isBlownOut) return;

            analyser.getByteFrequencyData(dataArray);
            let total = 0;
            for (let i = 0; i < dataArray.length; i++) {
                total += dataArray[i];
            }
            let avg = total / dataArray.length;

            if (avg > 75) {
                triggerCelebration();
            } else if (avg > 35) {
                // เป่าเบาๆ เทียนสั่นไหววูบวาบ
                candleFlame.className = "flame flicker-hard";
                statusText.innerText = "💨 DETECTING WIND... BLOW HARDER TO EXTINQUISH!";
            } else {
                candleFlame.className = "flame";
                statusText.innerText = "🎤 STANDBY: Blow hard directly into the mic to make your wish come true.";
            }

            requestAnimationFrame(monitorVolume);
        }

        function triggerCelebration() {
            isBlownOut = true;
            
            candleFlame.className = "flame extinguished";
            candleSmoke.className = "smoke active";
            statusText.innerText = "✨ QUEST COMPLETED: HAPPY BIRTHDAY, WISH GRANTED! 🎉";
            
            document.getElementById('status-container').style.backgroundColor = "var(--accent-yellow)";
            document.getElementById('status-container').style.borderColor = "var(--primary-purple)";

            // ปลดล็อคแก๊งน้องแมว 5 ตัว และ ป้ายเวลอัพลอยขึ้นมาอย่างสวยงาม
            mainPartyStage.classList.add('revealed');
            hbdMessageBanner.classList.add('show');

            initConfetti();
            animateConfetti();
        }
    </script>
</body>
</html>
